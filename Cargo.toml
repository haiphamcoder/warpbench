[package]
name = "warpbench"
version = "0.1.0"
edition = "2024"
authors = ["Hai Pham Ngoc <ngochai285nd@gmail.com>"]
description = "A modern HTTP benchmarking tool written in Rust"
license = "MIT"
repository = "https://github.com/haiphamcoder/warpbench"

[dependencies]
# Error handling
anyhow = "1.0.99"
thiserror = "2.0.14"

# Command line parsing
clap = { version = "4.5.45", features = ["derive"] }

# Time formatting
humantime = "2.2.0"

# System information
num_cpus = "1.17.0"

# Scripting engine
rhai = "1.22.2"

# Asynchronous runtime
tokio = { version = "1.47.1", features = ["full"] }

# Logging and tracing
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

# URL parsing
url = "2.5.4"

# HTTP client
hyper = { version = "1.6.0", features = ["full"] }
hyper-util = { version = "0.1.10", features = ["full"] }
http-body-util = "0.1.2"

# TLS support
hyper-rustls = { version = "0.27.3", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }

# Async utilities
futures = "0.3.31"
tokio-util = "0.7.12"

# Statistics and metrics
hdrhistogram = "7.5.4"

# Serialization
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

# Random number generation
rand = "0.9.2"

# Atomic operations
crossbeam = "0.8.4"
arc-swap = "1.7.1"

[dev-dependencies]
tempfile = "3.14.0"
