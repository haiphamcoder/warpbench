name: Release (Rust multi-platform)

on:
  push:
    tags:
      - "v*"   # Trigger when push tag like v0.1.0

permissions:
  contents: write   # need to create/edit Release

env:
  # If project has many binary, set BIN_NAME for the binary to release.
  # Default workflow will take the first package name in Cargo.toml.
  BIN_NAME: ""

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release (or reuse existing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

  build:
    name: Build & Package (${{ matrix.label }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-deb
            kind: deb
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            label: macos-dmg
            kind: dmg
            target: aarch64-apple-darwin
          - os: windows-latest
            label: windows-exe
            kind: exe
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      # ====== Detect name & version (Linux/macOS) ======
      - name: Detect package name & version (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Lấy tên package nếu BIN_NAME chưa set
          if [ -z "${BIN_NAME}" ]; then
            PKG_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          else
            PKG_NAME="${BIN_NAME}"
          fi
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

          # Lấy version từ tag: v1.2.3 -> 1.2.3
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ====== Detect name & version (Windows) ======
      - name: Detect package name & version (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:BIN_NAME)) {
            $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $pkgName = $meta.packages[0].name
          } else {
            $pkgName = $env:BIN_NAME
          }
          "PKG_NAME=$pkgName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ===================== Linux: build .deb =====================
      - name: Install deb tooling
        if: matrix.kind == 'deb'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq fakeroot

      - name: Install cargo-deb
        if: matrix.kind == 'deb'
        shell: bash
        run: cargo install cargo-deb

      - name: Build .deb
        if: matrix.kind == 'deb'
        shell: bash
        run: |
          # Build .deb (sử dụng metadata trong Cargo.toml)
          cargo deb
          mkdir -p dist
          ARCH=amd64
          # lấy file .deb sinh ra
          DEB_FILE=$(ls target/debian/*.deb | head -n 1)
          OUT="dist/${PKG_NAME}-${VERSION}-linux-${ARCH}.deb"
          cp "$DEB_FILE" "$OUT"
          echo "ASSET_PATH=$OUT" >> $GITHUB_ENV

      # ===================== macOS: build .dmg =====================
      - name: Build (macOS)
        if: matrix.kind == 'dmg'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package .dmg (unsigned)
        if: matrix.kind == 'dmg'
        shell: bash
        run: |
          mkdir -p dist/macos
          BIN_PATH="target/release/${PKG_NAME}"
          # Nếu build theo target triple (khuyên dùng khi set targets)
          if [ -f "target/${{ matrix.target }}/release/${PKG_NAME}" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/${PKG_NAME}"
          fi

          cp "$BIN_PATH" "dist/macos/${PKG_NAME}"
          chmod +x "dist/macos/${PKG_NAME}"

          ARCH=$(uname -m) # arm64 trên runners Apple Silicon
          DMG="dist/${PKG_NAME}-${VERSION}-macos-${ARCH}.dmg"
          hdiutil create -volname "${PKG_NAME}" -srcfolder "dist/macos" -ov -format UDZO "$DMG"
          echo "ASSET_PATH=$DMG" >> $GITHUB_ENV

      # ===================== Windows: build .exe =====================
      - name: Build (Windows)
        if: matrix.kind == 'exe'
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Collect .exe
        if: matrix.kind == 'exe'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe1 = "target\release\${{ env.PKG_NAME }}.exe"
          $exe2 = "target\${{ matrix.target }}\release\${{ env.PKG_NAME }}.exe"
          if (Test-Path $exe2) { $exe = $exe2 } else { $exe = $exe1 }
          $out = "dist\${{ env.PKG_NAME }}-${{ env.VERSION }}-windows-x86_64.exe"
          Copy-Item $exe $out
          "ASSET_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ===================== Upload to Release =====================
      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ASSET_PATH }}
